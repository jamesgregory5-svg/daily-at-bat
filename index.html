<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Daily At-Bat ⚾</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BE%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--acc:#ff8a2a;--rim:#b98cff}
html,body{margin:0;height:100%;overflow:hidden;background:#14121f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus:not(:focus-visible){outline:none}
.pn{background:rgba(14,12,26,.78);border:1px solid rgba(255,255,255,.13);border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:none;flex-direction:column;gap:5px;padding:6px 8px 0;padding-top:max(8px,env(safe-area-inset-top));pointer-events:none;max-width:760px;margin:0 auto}
#hud .r{display:flex;gap:6px}
#hud .r>.pn{flex:1;min-width:0;padding:4px 11px;display:flex;align-items:center;gap:10px}
#hTop{justify-content:space-between;padding:5px 6px!important}
#hTop .ttl{font-weight:900;font-size:clamp(18px,5.2vw,26px);letter-spacing:.01em;white-space:nowrap}
#hTop .ttl span{color:var(--acc)}
.ic{pointer-events:auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);font-size:20px;display:grid;place-items:center;flex:0 0 auto}
#hud small{display:block;font-size:9.5px;font-weight:800;opacity:.7;letter-spacing:.06em;text-transform:uppercase;color:var(--rim)}
#hud b{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#hud .gem{font-size:22px}
#hPDot{margin-left:auto;width:22px;height:22px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 10px currentColor}
#hCnt .bb{color:#7dff9b}#hCnt .ss{color:#ff8f7a}
#hOuts{margin-left:auto;font-size:13px;letter-spacing:2px;opacity:.9;text-align:right;line-height:1.2}
#hBases{width:30px;height:26px;flex:0 0 auto}
#box{position:fixed;z-index:4;right:10px;display:none;padding:2px 4px;pointer-events:none}
#npb{position:fixed;z-index:6;left:50%;top:calc(var(--ty,30%) - 60px);transform:translate(-50%,-8px);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;padding:7px 14px;max-width:92vw}
#npb.on{opacity:1;transform:translate(-50%,0)}#npb small{display:block;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--rim);opacity:.85}
#npb b{display:block;font-size:18px;font-weight:900}#npb>span{font-size:12.5px;opacity:.85;font-weight:700}#npb .pitches{margin:4px 0 0;gap:4px}#npb .pitches span{font-size:11px;padding:2px 7px}
#recb{position:fixed;z-index:9;left:50%;top:calc(var(--ty,30%) + 70px);transform:translate(-50%,0) scale(.6);opacity:0;pointer-events:none;text-align:center;padding:10px 22px 11px;border-radius:18px;
 background:linear-gradient(135deg,#ffd84a,#ff9a3c);color:#2a1606;box-shadow:0 8px 30px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.55) inset;transition:opacity .2s,transform .35s cubic-bezier(.2,1.6,.4,1)}
#recb.on{opacity:1;transform:translate(-50%,0) scale(1)}#recb i{font-style:normal;font-size:26px;display:block;line-height:1}#recb>b{display:block;font-size:28px;font-weight:900;letter-spacing:.04em;white-space:nowrap}#recb span{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;margin-top:2px}#recb span b{font-size:17px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px;font-size:11.5px;text-align:left}
.recs div{background:rgba(255,255,255,.06);border-radius:8px;padding:4px 8px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.recs span{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recs b{font-size:13px;white-space:nowrap}.recs .nw{background:rgba(255,200,60,.22);box-shadow:0 0 0 1px #ffd84a inset}
.recs em{font-style:normal;font-size:9px;background:#ffd84a;color:#2a1606;border-radius:5px;padding:1px 4px;vertical-align:2px}
.newrec{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:10px;background:linear-gradient(135deg,#ffd84a,#ff9a3c);color:#2a1606;font-weight:900}
.palog{max-height:170px;overflow:auto;-webkit-overflow-scrolling:touch}
#ctrl{position:fixed;left:0;right:0;bottom:0;z-index:5;display:none;flex-direction:column;align-items:center;gap:8px;padding:0 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));pointer-events:none}
#tb{width:min(520px,94vw);height:48px;display:block}
#swing{pointer-events:auto;width:min(240px,60vw);height:clamp(64px,11.5vh,104px);border-radius:50%;font-weight:900;font-size:clamp(30px,8vw,50px);letter-spacing:.02em;color:#fff;
  background:radial-gradient(ellipse at 50% 35%,#ffa24a,#ff6a10 55%,#c2410c);box-shadow:0 0 0 5px rgba(60,30,10,.9),0 0 0 7px rgba(255,140,50,.55),0 0 34px rgba(255,120,30,.55),inset 0 -6px 0 rgba(0,0,0,.2);text-shadow:0 3px 0 rgba(0,0,0,.3);touch-action:manipulation}
#swing:active,#swing.hit{transform:scale(.96);filter:brightness(1.15)}
#swing.wait{filter:saturate(.55) brightness(.8)}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;padding:14px;background:rgba(8,8,16,.55);overflow:auto}
.screen.on{display:flex}
.panel{background:rgba(18,16,30,.95);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px;width:min(430px,100%);box-shadow:0 18px 50px rgba(0,0,0,.45);text-align:center;margin:auto}
h1{margin:0;font-size:38px;letter-spacing:-.01em;line-height:1;font-weight:900}
h1 span{color:var(--acc)}
.sub{opacity:.8;font-size:14px;margin-top:6px}
.theme{margin:12px 0 4px;padding:10px;border-radius:14px;background:var(--tb,rgba(255,255,255,.07));font-weight:800;font-size:18px}
.theme small{display:block;font-weight:500;font-size:12px;opacity:.85;margin-top:2px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;margin-top:10px;font-weight:900;font-size:17px;background:var(--acc);color:#1a1428}
.btn.alt{background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:15px;padding:12px}
.row{display:flex;gap:8px}.row .btn{flex:1}
.stats{display:flex;justify-content:space-around;margin:12px 0 2px}
.stat b{display:block;font-size:21px}.stat span{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.05em}
.how{font-size:12.5px;opacity:.72;margin-top:12px;line-height:1.45;text-align:left}
.lineup{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:8px;font-size:11px;text-align:left}
.lineup div{background:rgba(255,255,255,.06);border-radius:8px;padding:4px 6px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lineup div.done{opacity:.45}.lineup b{color:var(--acc)}
table.bs{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
table.bs td,table.bs th{padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
table.bs th{font-size:10.5px;opacity:.7;text-transform:uppercase}
pre.share{background:rgba(0,0,0,.35);border-radius:12px;padding:10px;font-size:15px;white-space:pre-wrap;margin:12px 0 4px;font-family:inherit;line-height:1.45}
#toast{position:fixed;left:50%;top:var(--ty,30%);transform:translate(-50%,-50%);z-index:8;pointer-events:none;text-align:center;opacity:0;transition:opacity .2s;width:94vw}
#toast.on{opacity:1}
#toast b{display:block;font-size:clamp(34px,9vw,52px);font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.4),0 0 24px rgba(0,0,0,.5)}
#toast span{font-size:15px;font-weight:700;background:rgba(10,10,20,.7);padding:4px 10px;border-radius:10px;display:inline-block;margin-top:6px}
#toast b.hr{color:#ffb14a}#toast b.hit{color:#7dff9b}#toast b.out{color:#e8e6f0}#toast b.k{color:#ff7a6a}#toast b.bb{color:#ffe266}
#copied{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;padding:8px 14px;border-radius:10px;z-index:30;display:none;font-weight:700}
.pcard .who{font-size:26px;font-weight:900;margin-top:4px}
.pcard .lbl{color:var(--acc);font-weight:800;font-size:15px}
.pitches{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}
.pitches span{background:rgba(255,255,255,.08);border-radius:10px;padding:5px 9px;font-weight:700;font-size:13px}
.pitches i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.sit{font-size:13px;opacity:.8;margin-top:6px}
.opt{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:6px 0 2px}
.opt button{background:rgba(255,255,255,.09);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px}
.opt button.on{background:var(--acc);color:#1a1428}
.olbl{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.06em;margin-top:10px;font-weight:800}
@media (max-height:740px){#hud .r>.pn{padding:4px 10px}#hud b{font-size:16px}#hud small{font-size:9.5px}.ic{width:34px;height:34px;font-size:17px}#tb{height:40px}#hud{gap:4px}}
@media (min-aspect-ratio:13/10){#hud{max-width:none;flex-direction:row;align-items:stretch}#hud .r{flex:1}#hud #r1{flex:1.15}#ctrl{flex-direction:row;justify-content:center;gap:18px}#swing{width:200px;height:84px;font-size:38px}}
</style>

<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="r" id="r1"><div class="pn" id="hTop"><button class="ic" id="bMenu" aria-label="Menu">🎃</button><div class="ttl">DAILY AT-BAT <span id="hNum">#1</span></div><button class="ic" id="bMute" aria-label="Sound">🔊</button></div></div>
  <div class="r"><div class="pn"><span class="gem">💎</span><div><small>Batter</small><b id="hAB">#1</b></div></div><div class="pn" style="flex:1.6"><div style="min-width:0"><small id="hPn">Pitcher</small><b id="hP">—</b></div><span id="hPDot"></span></div></div>
  <div class="r"><div class="pn"><div><small>Count</small><b id="hCnt">0-0</b></div><div id="hOuts"></div></div><div class="pn" style="flex:1.6"><div style="min-width:0"><small id="hLbl">Today</small><b id="hLine">0 H</b></div></div></div>
</div>
<div id="box" class="pn"><canvas id="dia" style="width:164px;height:96px;display:block"></canvas></div>
<div id="npb" class="pn"></div>
<div id="recb"></div>
<div id="ctrl"><canvas id="tb"></canvas><button id="swing">SWING</button></div>
<div id="toast"><b id="tBig"></b><span id="tSmall"></span></div>
<div class="screen" id="sTitle"><div class="panel" id="titlePanel"></div></div>
<div class="screen" id="sCard"><div class="panel pcard" id="cardPanel"></div></div>
<div class="screen" id="sMenu"><div class="panel" id="menuPanel"></div></div>
<div class="screen" id="sSum"><div class="panel" id="sumPanel"></div></div>
<div id="copied">Copied! 📋</div>
<script>
'use strict';
/* ===== Daily At-Bat engine: dates, seeded RNG, themes, pitchers, pitches, contact + outcome model (pure, deterministic) ===== */
const VERSION=1,EPOCH=Date.UTC(2026,9,21);
const TAU=Math.PI*2,DEG=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,pad=n=>String(n).padStart(2,'0');
function xmur(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^h>>>16)>>>0}
function RNG(seed){let a=typeof seed==='string'?xmur(seed):seed>>>0;const f=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  f.int=n=>Math.floor(f()*n);f.range=(x,y)=>x+f()*(y-x);f.pick=a=>a[Math.floor(f()*a.length)];f.chance=p=>f()<p;
  f.shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};return f}
function keyOfDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function keyUTC(key){const p=key.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])}
function dayNum(key){return Math.round((keyUTC(key)-EPOCH)/864e5)+1}
function keyAdd(key,n){const t=new Date(keyUTC(key)+n*864e5);return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())}

/* ---- geometry in feet. x: + toward the 1B side (catcher's right), y: toward center field, z: up ---- */
const ZX=17/24,ZB=1.6,ZT=3.45,BR=0.121,ZC=(ZB+ZT)/2;
const REL_Y=54,CON_Y=1.5,MITT_Y=-2.4,SLOW=1.75;
const isStrike=(x,z)=>Math.abs(x)<=ZX+BR&&z>=ZB-BR&&z<=ZT+BR;
/* timing windows (ms either side of ideal contact) */
const W_PERF=16,W_GOOD=48,W_WEAK=68,W_FOUL=90;

/* ---- pitch types: h = arm-side run (in), v = extra drop vs. a straight line (in), laT = launch-angle tendency ---- */
const PT={
 FF:{id:'FF',name:'4-Seam Fastball',short:'Fastball',h:7,v:4,col:'#ff5b5b',fast:1,laT:4},
 SI:{id:'SI',name:'Sinker',short:'Sinker',h:14,v:12,col:'#ffa043',fast:1,laT:-7},
 FC:{id:'FC',name:'Cutter',short:'Cutter',h:-4,v:7,col:'#ffe14d',fast:1,laT:-1},
 SL:{id:'SL',name:'Slider',short:'Slider',h:-10,v:10,col:'#4fd2ff',fast:0,laT:-2},
 CU:{id:'CU',name:'Curveball',short:'Curve',h:-7,v:22,col:'#b784ff',fast:0,laT:-3},
 CH:{id:'CH',name:'Changeup',short:'Change',h:12,v:16,col:'#5dff8f',fast:0,laT:-5},
 FS:{id:'FS',name:'Splitter',short:'Splitter',h:5,v:20,col:'#ff7ad9',fast:0,laT:-8},
};
const PT_IDS=['FF','SI','FC','SL','CU','CH','FS'];
const ARCH=[
 {id:'flame',name:'Flamethrower',mix:[['FF',97,6],['SL',87,2.5],['CH',87,1.5]]},
 {id:'sinker',name:'Sinkerballer',mix:[['SI',93,5.5],['SL',83,2.5],['CH',84,2]]},
 {id:'slider',name:'Slider Ace',mix:[['FF',93,4.5],['SL',85,4.5],['CH',85,1]]},
 {id:'curve',name:'Curveball Artist',mix:[['FF',91,5],['CU',77,3.5],['CH',83,1.5]]},
 {id:'change',name:'Changeup Wizard',mix:[['FF',90,4.5],['CH',80,4],['CU',75,1.5]]},
 {id:'cutter',name:'Cutter Machine',mix:[['FC',90,5.5],['FF',93,2.5],['CU',77,2]]},
 {id:'split',name:'Splitter Specialist',mix:[['FF',94,5],['FS',85,4],['SL',84,1]]},
 {id:'junk',name:'Crafty Junkballer',mix:[['FF',85,3],['CU',73,2.5],['CH',76,2.5],['FC',82,2]]},
 {id:'closer',name:'Power Closer',mix:[['FF',98,6.5],['SL',88,2],['FS',88,1.5]]},
];
const FIRST=['Jake','Luis','Mason','Tyler','Diego','Cole','Hunter','Ryan','Marcus','Kenji','Andre','Brody','Mateo','Carlos','Owen','Shane','Trey','Nolan','Gabe','Ivan','Dante','Wyatt','Kai','Rafael','Bo','Eli','Hiro','Jalen','Max','Sonny','Colt','Reggie','Tomas','Zeke','Austin','Felix'];
const LAST=['Ramirez','Walker','Okafor','Tanaka','Brooks','McAllister','Vega','Holloway','Castillo','Pruitt','Nakamura','Delgado','Whitfield','Santos','Kowalski','Fontaine','Rhodes','Ibarra','Sterling','Quinn','Hargrove','Moreno','Blackwood','Chen','Duvall','Reyes','Lockhart','Ortega','Mercer','Kim','Bishop','Valdez','Crowe','Lindqvist','Abbott','Fuentes'];
function makePitcher(i,arch,r,used){
  const hand=arch.id==='closer'?(r.chance(.25)?'L':'R'):(r.chance(.32)?'L':'R');
  let nm;do{nm=r.pick(FIRST)+' '+r.pick(LAST)}while(used.has(nm));used.add(nm);
  const ramp=-4.5+i*.85,bm=(.86+i*.035)*r.range(.93,1.07);
  const mix=arch.mix.map(([t,mph,w])=>({t,mph:Math.round(clamp(mph+ramp+r.range(-1.2,1.2),70,99)),w,brk:+(bm*r.range(.92,1.08)).toFixed(3)}));
  return{i,name:nm,hand,arch:arch.id,archName:arch.name,label:(hand==='L'?'Lefty ':'Righty ')+arch.name,mix,zone:+clamp(r.range(.5,.58)-i*.01,.42,.6).toFixed(3)};
}
function makeLineup(seed){const r=RNG('dab-lineup|'+seed);const order=r.shuffle(ARCH.slice(0,8));order.push(ARCH[8]);const used=new Set();return order.map((a,i)=>makePitcher(i,a,r,used))}
/* one pitch, fully determined by the RNG it is given */
function choosePitch(P,b,s,r,opt){
  opt=opt||{};let m;
  if(opt.type&&opt.type!=='any'){const pt=PT[opt.type];m=P.mix.find(q=>q.t===opt.type)||{t:opt.type,mph:pt.fast?92:pt.id==='CU'?77:84,w:1,brk:1}}
  else{let tot=0;const ws=P.mix.map(q=>{let w=q.w;const fast=PT[q.t].fast;if(!fast)w*=P.brkW||1;if(s===2&&!fast)w*=1.7;if(b>s&&b>=2&&fast)w*=1.9;if(b===0&&s===0&&fast)w*=1.2;tot+=w;return w});
    let x=r()*tot,k=0;for(;k<ws.length-1;k++){x-=ws[k];if(x<0)break}m=P.mix[k]}
  const pt=PT[m.t];let mph=m.mph+r.range(-1.1,1.1);if(opt.mph)mph=opt.mph+r.range(-.5,.5);mph=+clamp(mph,68,101).toFixed(1);
  let zp=P.zone+.1*b-.09*s+(b===3?.12:0)-(s===2&&b<2?.06:0);if(opt.loc==='strikes')zp=1;else if(opt.loc==='balls')zp=0;zp=clamp(zp,opt.loc?0:.28,opt.loc?1:.9);
  const iz=r()<zp,glove=P.hand==='R'?1:-1;let x,z;
  if(iz){x=r.range(-ZX*.92,ZX*.92);z=r.range(ZB+.08,ZT-.08)}
  else{const q=r();
    if(!pt.fast){if(q<.55){x=r.range(-ZX*.9,ZX*.9);z=ZB-BR-r.range(.15,.75)}else if(q<.85){x=glove*(ZX+BR+r.range(.12,.6));z=r.range(ZB,ZT-.3)}else{x=-glove*(ZX+BR+r.range(.15,.5));z=r.range(ZB,ZT)}}
    else{if(q<.4){x=r.range(-ZX*.9,ZX*.9);z=ZT+BR+r.range(.12,.6)}else if(q<.75){const sd=r.chance(.5)?1:-1;x=sd*(ZX+BR+r.range(.12,.55));z=r.range(ZB+.1,ZT-.1)}else{x=r.range(-ZX*.9,ZX*.9);z=ZB-BR-r.range(.12,.5)}}}
  const arm=P.hand==='R'?-1:1;
  return{t:m.t,name:pt.name,mph,x:+x.toFixed(4),z:+z.toFixed(4),hx:arm*pt.h*m.brk/12,vz:pt.v*m.brk/12,rx:arm*1.85+r.range(-.08,.08),rz:5.85+r.range(-.08,.08),
    T:(REL_Y-CON_Y)/(mph*1.4667)*SLOW,strike:isStrike(x,z),hand:P.hand,nasty:P.nasty||0};
}
function dailyPitch(seed,P,ab,pn,b,s){return choosePitch(P,b,s,RNG('dab-p|'+seed+'|'+ab+'|'+pn+'|'+b+'|'+s))}
/* ball position at progress u (0 = release, 1 = ideal contact point just in front of the plate) */
function ballPos(p,u,o){const u2=u*u;o.y=REL_Y+(CON_Y-REL_Y)*u;
  o.x=p.rx+((p.x-p.hx)-p.rx)*u+p.hx*u2;o.z=p.rz+((p.z+p.vz)-p.rz)*u-p.vz*u2;return o}
const mittU=p=>(REL_Y-MITT_Y)/(REL_Y-CON_Y);

/* ---- the swing: outcome depends only on the pitch (same for everyone) and the player's timing / aim ---- */
function timingLabel(err){const e=Math.abs(err);if(e<=W_PERF)return'Perfect';const w=e<=W_GOOD?'A bit ':e<=W_WEAK?'':'Way ';return w+(err<0?'early':'late')}
function swingContact(p,err,aim){
  const e=Math.abs(err),lbl=timingLabel(err);
  if(e>W_FOUL)return{contact:false,why:err<0?'Way early':'Way late',lbl,err};

  if(G.phase!=='flight'||G.swingT>=0)return;if(t<G.tRel)t=G.tRel;
  G.swingT=t;const err=t-G.tIdeal;G.lastErr=err;tbDirty=true;
  const c=swingContact(G.pitch,err,SAVE.aim==='manual'?{x:G.pci.x,z:G.pci.z}:null);G.con=c;
  if(!c.contact){G.whiff=true;SFX.whiff();commit('whiff');G.hudHold=true;return}
  const bb=battedBall(c);G.bb=bb;const foul=bb.res==='FOUL';if(c.tip)SFX.tip();else SFX.crack(c.q);
  commit(foul?'foul':'inplay',bb);G.hudHold=true;startHit(t);
}
/* runner animation on the mini diamond: every runner moves together, ~360ms per base */
function stepRA(){const ra=G.ra;if(!ra)return;const el=NOW-ra.t0;let home=0;
  for(const m of ra.moves){if(m[1]!==4)continue;const at=Math.abs(4-m[0])*360;if(el>=at)home++}
  if(home>ra.fired){const n=home-ra.fired;ra.fired=home;G.disp.R=ra.base+home;G.pop=NOW;G.popN=n;if(ra.t0>0){SFX.score(home);burst(diaXY().x,diaXY().y,14,[G.T.acc,'#fff'],120,.6)}}
  if(el>=ra.dur){syncDisp();diaDirty=true}}

/* ---------- batted-ball animation ---------- */
const HP={x:0,y:0,z:0};
function startHit(t){const bb=G.bb,p=G.pitch,u=clamp((t-G.tRel)/(p.T*1000),0,mittU(p));const c0=ballPos(p,u,{x:0,y:0,z:0});
  let dur,endZ=0;if(bb.kind==='tip')dur=.55;else if(bb.kind==='ground')dur=clamp(bb.dist/115,.75,1.7);else dur=clamp(bb.hang*.5,.75,2.7);
  if(bb.res==='HR'){endZ=22;dur+=.2}else if(bb.f>=0&&RES[bb.res]&&RES[bb.res].out&&bb.kind!=='ground')endZ=5;
  let fx=0,fy=0,fi=bb.f;if(fi<0&&(bb.res==='1B'||bb.res==='2B'||bb.res==='3B')){let best=1e9;for(let k=0;k<3;k++){const q=pol(OFD[k][0],OFD[k][1]),d=Math.hypot(q[0]-bb.lx,q[1]-bb.ly);if(d<best){best=d;fi=4+k}}}
  G.hit={t0:t,dur:dur*1000,c0,endZ,fi,tx:bb.lx,ty:bb.ly,trail:[],landed:false,caught:RES[bb.res]&&RES[bb.res].out};
  G.phase='hit';if(bb.kind!=='tip')camTo(CAMH,520)}
function hitPos(s,o){const h=G.hit,bb=G.bb;
  if(bb.kind==='tip'){o.x=h.c0.x+s*3;o.y=lerp(h.c0.y,-40,s);o.z=h.c0.z+s*30;return o}
  const e=bb.kind==='ground'?1-Math.pow(1-s,1.6):s;o.x=lerp(h.c0.x,h.tx,e);o.y=lerp(h.c0.y,h.ty,e);
  if(bb.kind==='ground'){const hops=Math.abs(Math.sin(s*Math.PI*3.2))*(1-s)*Math.min(8,bb.ev/12);o.z=lerp(h.c0.z,0,Math.min(1,s*4))+hops}
  else o.z=lerp(h.c0.z,h.endZ,s)+4*bb.apex*s*(1-s);return o}
function fielderPos(k){if(k<4)return pol(IFD[k][0],IFD[k][1]);return pol(OFD[k-4][0],OFD[k-4][1])}

/* mini diamond widget: runners (animated), out dots, big run count, hit streak */
const dia=$('dia'),dctx=dia.getContext('2d');let diaDirty=true;const DW=164,DH=96;
function diaXY(){const r=dia.getBoundingClientRect();return{x:r.left+r.width*.73,y:r.top+r.height*.4}}
function drawDia(){const dpr=Math.min(2,window.devicePixelRatio||1);if(dia.width!==DW*dpr){dia.width=DW*dpr;dia.height=DH*dpr}
  const c=dctx;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,DW,DH);const T=G.T,pr=G.mode==='practice';

  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1.5;c.stroke();

  for(let k=1;k<=3;k++){c.save();c.translate(B[k][0],B[k][1]);c.rotate(Math.PI/4);c.fillStyle=occ[k-1]?T.acc:'rgba(255,255,255,.22)';c.fillRect(-6.5,-6.5,13,13);if(occ[k-1]){c.strokeStyle='#fff';c.lineWidth=1.5;c.strokeRect(-6.5,-6.5,13,13)}c.restore()}
  c.fillStyle='#fff';c.beginPath();c.moveTo(cx-5,cy+r-4);c.lineTo(cx+5,cy+r-4);c.lineTo(cx+5,cy+r+1);c.lineTo(cx,cy+r+5);c.lineTo(cx-5,cy+r+1);c.closePath();c.fill();
  const pos=v=>{v=clamp(v,0,4);const i=Math.min(3,Math.floor(v)),f=v-i;return[lerp(B[i][0],B[i+1][0],f),lerp(B[i][1],B[i+1][1],f)]};
  if(ra){for(const m of ra.moves){let v,a=1;if(m[1]<0){v=m[0]+(m[0]===0?.45:0)*Math.min(1,el/300);a=clamp(1-el/450,0,1)}else{const d=m[1]-m[0];v=m[0]+Math.sign(d)*Math.min(Math.abs(d),el/360);if(m[1]===4&&v>=4)a=clamp(1-(el-Math.abs(d)*360)/200,0,1)}
      if(a<=0)continue;const q=pos(v);c.globalAlpha=a;c.fillStyle=T.acc;c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();c.arc(q[0],q[1]-1,5.2,0,TAU);c.fill();c.stroke();c.globalAlpha=1}}

  c.textAlign='center';c.textBaseline='alphabetic';c.fillStyle='rgba(255,255,255,.7)';c.font='800 9.5px system-ui,sans-serif';c.fillText(pr?'HITS':'RUNS',120,13);
  c.save();c.translate(120,47);c.scale(sc,sc);c.font='900 34px system-ui,sans-serif';c.fillStyle=pe<1?'#fff':T.acc;c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=6;c.fillText(String(pr?G.prac.h:G.disp.R),0,0);c.restore();

  if(!pr){for(let i=0;i<3;i++){c.beginPath();c.arc(106+i*14,63,4.6,0,TAU);if(i<G.disp.outs){c.fillStyle='#ff6a5a';c.fill()}else{c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.4;c.stroke()}}
    c.font='800 10.5px system-ui,sans-serif';c.fillStyle=G.disp.streak>=2?'#ffd06a':'rgba(255,255,255,.6)';c.fillText((G.disp.streak>=2?'🔥':'')+'Hit streak '+G.disp.streak,120,86)}

}

const tb=$('tb'),tbc=tb.getContext('2d');let tbDirty=true;const TB0=-300,TB1=150;
function drawTB(){const dpr=Math.min(2,window.devicePixelRatio||1),w=tb.clientWidth,h=tb.clientHeight;if(!w)return;if(tb.width!==Math.round(w*dpr)||tb.height!==Math.round(h*dpr)){tb.width=Math.round(w*dpr);tb.height=Math.round(h*dpr)}
  const c=tbc;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);const p=6,bh=h-14,by=10,X=ms=>p+(clamp(ms,TB0,TB1)-TB0)/(TB1-TB0)*(w-2*p);
  const rr=(x,y,ww,hh,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+ww,y,x+ww,y+hh,r);c.arcTo(x+ww,y+hh,x,y+hh,r);c.arcTo(x,y+hh,x,y,r);c.arcTo(x,y,x+ww,y,r);c.closePath()};
  rr(1,by-3,w-2,bh+6,(bh+6)/2);c.fillStyle='rgba(14,12,26,.85)';c.fill();c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=1;c.stroke();
  c.save();rr(p,by,w-2*p,bh,bh/2);c.clip();
  const segs=[[TB0,-W_FOUL,'#4a2a9a'],[-W_FOUL,-W_GOOD,'#7c52d8'],[-W_GOOD,W_GOOD,'#2f9e48'],[-W_PERF,W_PERF,'#57d873'],[W_GOOD,W_FOUL,'#d8453a'],[W_FOUL,TB1,'#9a2a2a']];
  for(const s of segs){c.fillStyle=s[2];c.fillRect(X(s[0]),by,X(s[1])-X(s[0])+.5,bh)}c.fillStyle='rgba(255,255,255,.12)';c.fillRect(p,by,w,bh*.35);c.restore();
  c.fillStyle='#fff';c.font='800 10px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('★ SWEET SPOT',X(0),by+bh/2+.5);
  let ms=null,frozen=false;if(G.swingT>=0&&(G.phase==='flight'||G.phase==='hit'||G.phase==='post')){ms=G.swingT-G.tIdeal;frozen=true}
  else if(G.phase==='flight'&&SAVE.bar==='live'){ms=NOW-G.tIdeal;if(ms<TB0)ms=null}
  if(ms!==null){const x=X(ms);c.fillStyle='rgba(255,255,255,.28)';c.beginPath();c.arc(x,by+bh/2,bh*.55,0,TAU);c.fill();c.fillStyle='#fff';c.fillRect(x-1.5,by-6,3,bh+12);
    if(frozen){const lbl=G.con?G.con.lbl:timingLabel(ms),sm=Math.abs(ms)<1000?` ${ms>0?'+':''}${Math.round(ms)}ms`:'';c.font='800 11px system-ui,sans-serif';c.fillStyle='#fff';c.textBaseline='top';c.fillText(lbl+sm,clamp(x,50,w-50),0)}}
  else if(G.phase==='windup'||G.phase==='flight'){c.font='700 10px system-ui,sans-serif';c.fillStyle='rgba(255,255,255,.6)';c.textBaseline='top';c.fillText(SAVE.bar==='live'?(G.phase==='windup'?'get ready…':''):'PRO: no live marker',w/2,0)}
}
